manifest:
  remotes:
    # Our fork of ZMK, not upstream. v0.3-zen is v0.3 plus one commit:
    # "fix(split): retry peripheral advertising when it fails to start".
    # Without it a peripheral that loses the bt_le_adv_start() race on
    # reconnect goes silent until its power switch is cycled -- see
    # docs/zmk-fork.md before bumping the revision below.
    - name: e24-gh
      url-base: https://github.com/E24-GH
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: kot149
      url-base: https://github.com/kot149
    - name: kumamuk-git
      url-base: https://github.com/kumamuk-git
    - name: badjeff
      url-base: https://github.com/badjeff
  projects:
    - name: zmk
      remote: e24-gh
      revision: v0.3-zen
      import: app/west.yml
    - name: zmk-component-bmp-boost
      remote: sekigon-gonnoc
      import: west.yml
      revision: v0.2
    - name: zmk-feature-status-led
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: torabo-tsuki
    - name: zmk-feature-cdc-acm-bootloader-trigger
      remote: sekigon-gonnoc
      revision: v0.2
    - name: zmk-feature-non-lipo-battery-management
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-scroll-snap
      remote: kot149
      revision: v1
  self:
    path: config
